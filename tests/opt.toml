
[compiler]
# Unsafe optimizations.
unsafe-opt = [
    # Remove division by zero checks.
    "no-div-zero",

    # Assume interrupts not caused by `syscall` or `breakpt` do not 
    # observably change the machine state if they return. This prevents 
    # the compiler from reloading registers from the LP's bank after
    # instructions like memory operations.
    "transparent-implicit-interrupts",

    # Assume that usermode programs only access RAM. This allows the 
    # compiler to drastically simplify the implementation of memory operations.
    "no-usermode-io",

    # Assume that T(vaddr + const) = T(vaddr) + const.
    # This allows the compiler to do much less virtual address translation.
    "trivial-vaddr-offset-const",

    # Assume that T(vaddr + anything) = T(vaddr) + anything.
    # Same idea as above, but taken to the extreme.
    "trivial-vaddr-offset-any",

    # Assume SC instructions never fail.
    # VERY NOT RECOMMENDED for multiprocessor systems.
    "no-lock-invalidation",
]
